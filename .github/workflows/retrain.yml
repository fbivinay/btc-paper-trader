name: weekly retrain

# Sunday 02:00 UTC. Kaggle does the training on its free GPU; this workflow only
# orchestrates: push code, wait, pull results, run the promotion gate.
#
# The gate is the point. A model finishing training is not a reason to deploy
# it -- promote_model.py only promotes a candidate that beats the round-trip
# cost, is profitable on a majority of folds, predicts both directions, and
# beats the incumbent. Otherwise the current production model keeps running.
on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Evaluate the gate but do not change production"
        type: boolean
        default: false

concurrency:
  group: retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    # Kaggle GPU sessions can run for hours; the walk-forward sweep took ~1h.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet pandas numpy pyarrow kaggle
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu

      - name: Push code to Kaggle and start the run
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python ml/push_kaggle.py -m "weekly retrain ${{ github.run_number }}"

      - name: Wait for the kernel
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          for i in $(seq 1 120); do
            status=$(kaggle kernels status fbivinay06/btc-lstm-walkforward 2>&1 || true)
            echo "[$i] $status"
            case "$status" in
              *COMPLETE*) exit 0 ;;
              *ERROR*|*CANCEL*) echo "kernel failed"; exit 1 ;;
            esac
            sleep 60
          done
          echo "timed out waiting for kernel"; exit 1

      - name: Pull results
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python ml/pull_kaggle.py

      - name: Promotion gate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python ml/promote_model.py --register \
            artifacts/artifacts/walkforward_h48.json \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Keep the trained model and its metrics
        uses: actions/upload-artifact@v4
        with:
          name: model-${{ github.run_number }}
          path: |
            artifacts/artifacts/*.json
            artifacts/artifacts/*.pt
          retention-days: 90
