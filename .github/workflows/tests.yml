name: tests

# Every module ships an assert-based self-check: the tax rules, the model's
# no-lookahead and no-leverage guarantees, the broker's safety rules and the
# database client. A change that breaks one fails here, not in the ledger.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  selfchecks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install --quiet -r requirements.txt

      - name: Self-checks
        working-directory: ml
        run: |
          python etf_tax_sim.py
          python etf_model.py
          python broker.py
          python db.py
          python etf_daily.py check
