name: live trading loop

# Every 5 minutes. GitHub's scheduler is best-effort and routinely runs late or
# skips under load, which is why live_loop.py keys off candle_time and backfills
# missed candles rather than assuming one run == one candle.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute but write nothing"
        type: boolean
        default: false

concurrency:
  # Two overlapping runs would both read the same open positions and could
  # double-enter. Never cancel the one already running -- it may be mid-write.
  group: live-loop
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        # CPU-only torch: the GPU build is ~2.5GB and inference on one 120-bar
        # sequence does not need it.
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet pandas numpy pyarrow
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run loop
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
        run: |
          python ml/live_loop.py ${{ inputs.dry_run && '--dry-run' || '' }}
